# KEDA ScaledObject: scale submitter Deployment on Kafka consumer group lag.
# Lag is obtained from the Strimzi Kafka cluster (broker); KEDA's kafka trigger queries
# the broker directly. Alternatively, deploy Strimzi Kafka Exporter to expose lag as
# Prometheus metrics (e.g. kafka_consumer_group_lag) and use a prometheus trigger.
# Requires KEDA installed (e.g. helm install keda kedacore/keda -n keda --create-namespace).
# Override bootstrapServers via kustomize or replace to match your Kafka cluster.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: submitter
  namespace: system
spec:
  scaleTargetRef:
    name: submitter
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
        consumerGroup: gpu-scheduler-submitter
        topic: gpu.workloads.submit
        lagThreshold: "5"
        activationLagThreshold: "1"
