# Submitter: Deployment + RBAC. For the ingestion bottleneck demo we run at a fixed replica
# count (no KEDA autoscaling) so that ingestion capacity is controlled explicitly.
# Prerequisites: Kafka topic gpu.workloads.submit (e.g. 14 partitions).
# Override brokers/image via kustomize (e.g. replace or patches).
# Namespace "system" is created so submitter can be applied before simulator/operator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system
resources:
  - namespace.yaml
  - deployment.yaml
  - rbac.yaml
