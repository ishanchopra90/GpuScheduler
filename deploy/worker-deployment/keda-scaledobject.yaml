# KEDA ScaledObject: scale worker Deployment on Prometheus backlog metric
# (gpu_scheduler_scheduled_workloads). Requires KEDA and Prometheus scraping the
# operator metrics. Override serverAddress to match your Prometheus query URL.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-deployment
  namespace: system
spec:
  scaleTargetRef:
    name: worker-deployment
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        query: sum(gpu_scheduler_scheduled_workloads)
        threshold: "2"
        activationThreshold: "1"
