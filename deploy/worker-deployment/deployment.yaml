# Worker Deployment (scale-focused): long-lived pods that poll for Phase=Scheduled
# GPUWorkloads, claim one, run simulator, update status. For the ingestion bottleneck
# demo we run at a fixed replica count (no KEDA autoscaling) so execution capacity is
# controlled explicitly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: system
  labels:
    app.kubernetes.io/name: gpu-scheduler-worker-deployment
    app.kubernetes.io/component: worker-deployment
spec:
  replicas: 16
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-scheduler-worker-deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-scheduler-worker-deployment
        app.kubernetes.io/component: worker-deployment
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: gpu-scheduler-worker-deployment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: SIMULATOR_URL
              value: "http://simulator:8080"
            - name: NAMESPACE
              value: "default"
            # USE_QUEUE enables queue-based worker discovery via Kafka (option 4).
            # When true (default here), workers consume claimable workloads from
            # the gpu.workloads.claimable topic instead of using a watch-based
            # informer cache for GPUWorkload.
            - name: USE_QUEUE
              value: "true"
            - name: KAFKA_BROKERS
              value: "kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: CLAIMABLE_TOPIC
              value: "gpu.workloads.claimable"
            # WORKER_ID defaults to HOSTNAME (pod name) if unset
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      serviceAccountName: worker-deployment
